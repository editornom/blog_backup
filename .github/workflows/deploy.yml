name: 수집 및 배포

on:
  push:
    branches: [main]
  schedule:
    # 6시간마다. 네이버 RSS 는 최근 50개만 주므로 하루 50편 넘게 쓰는 블로그가 생기면 주기를 줄이세요.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: RSS 수집
        run: pnpm run fetch

      - name: 수집 결과 커밋
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "chore: 블로그 글 데이터 갱신"
            git push
          fi

      - run: pnpm run build
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Cloudflare Pages 배포
        run: pnpm dlx wrangler@4 pages deploy dist --project-name=editornom
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: IndexNow 통보
        run: pnpm run indexnow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
